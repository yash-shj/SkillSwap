<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Service</title><style>body{font-family:system-ui;max-width:700px;margin:48px auto;padding:24px;background:#f6f4ee;color:#183235}.panel{background:#fffdf8;padding:24px;border:1px solid #d9dfd8;border-radius:6px;margin:16px 0}label{display:block;margin:12px 0;font-weight:600}input{display:block;width:100%;padding:10px;margin-top:6px;box-sizing:border-box}button{padding:11px 16px;background:#183235;color:#fff;border:0;border-radius:3px}.links a{margin-right:14px}</style></head><body><p>USER SERVICE / PROFILE GUI</p><h1>Account and skills profile</h1><div class="panel"><div class="links"><a href="/">Users</a><a href="/../matches/">Matches</a><a href="/../sessions/">Sessions</a></div><h2 id="title">Log in</h2><form id="form"><label id="name" hidden>Name<input name="name"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button>Log in</button></form><p><button id="toggle" type="button">Need an account? Sign up</button></p><p id="message"></p></div><div class="panel" id="profile" hidden></div><script>const f=document.querySelector('#form'),m=document.querySelector('#message'),n=document.querySelector('#name'),t=document.querySelector('#title'),b=f.querySelector('button'),toggle=document.querySelector('#toggle');let signup=false;toggle.onclick=()=>{signup=!signup;n.hidden=!signup;t.textContent=signup?'Sign up':'Log in';b.textContent=signup?'Create account':'Log in';toggle.textContent=signup?'Have an account? Log in':'Need an account? Sign up'};async function api(p,o={}){let r=await fetch(p,{headers:{'Content-Type':'application/json'},credentials:'include',...o}),d=await r.json();if(!r.ok)throw Error(d.error);return d}f.onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(f));try{if(signup)await api('/api/signup',{method:'POST',body:JSON.stringify(data)});let d=await api('/api/login',{method:'POST',body:JSON.stringify(data)});show(d.user);m.textContent='Logged in.'}catch(x){m.textContent=x.message}};async function show(u){f.parentElement.hidden=true;let p=document.querySelector('#profile');p.hidden=false;p.innerHTML='<h2>'+u.name+'</h2><p>'+u.email+'</p><form id="pf"><label>Skills I can teach<input name="offered" value="'+u.offered_skills.join(', ')+'"></label><label>Skills I want to learn<input name="wanted" value="'+u.wanted_skills.join(', ')+'"></label><button>Save profile</button></form>';document.querySelector('#pf').onsubmit=async e=>{e.preventDefault();let x=new FormData(e.target),d=await api('/api/profile',{method:'PUT',body:JSON.stringify({offered_skills:x.get('offered').split(','),wanted_skills:x.get('wanted').split(',')})});show(d.user)}};</script></body></html>
