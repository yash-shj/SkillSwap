<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheduling Service</title><style>body{font-family:system-ui;max-width:760px;margin:48px auto;padding:24px;background:#f6f4ee;color:#183235}.panel{background:#fffdf8;padding:24px;border:1px solid #d9dfd8;border-radius:6px;margin:16px 0}label{display:block;margin:12px 0;font-weight:600}select,input{display:block;width:100%;padding:10px;margin-top:6px;box-sizing:border-box}button{padding:11px 16px;background:#183235;color:#fff;border:0;border-radius:3px}a{margin-right:14px}</style></head><body><p>SCHEDULING SERVICE / OWN GUI</p><h1>Schedule an exchange</h1><p><a href="/../users/">Users</a><a href="/../matches/">Matches</a><a href="/">Sessions</a></p><form id="form" class="panel"><label>Recipient<select name="recipient_id" required></select></label><label>Proposed time<input type="datetime-local" name="proposed_time" required></label><button>Send proposal</button></form><div id="out"></div><script>async function api(p,o={}){let r=await fetch(p,{headers:{'Content-Type':'application/json'},credentials:'include',...o}),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){try{let [u,s]=await Promise.all([api('/api/users'),api('/api/sessions')]);form.recipient_id.innerHTML=u.users.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');out.innerHTML=s.sessions.map(x=>'<div class="panel"><strong>'+x.proposer_name+' -> '+x.recipient_name+'</strong><p>'+x.proposed_time+' | '+x.status+'</p>'+(x.status==='proposed'?' <button onclick="accept('+x.id+')">Accept</button>':'')+'</div>').join('')||'<div class="panel">No sessions yet.</div>'}catch(e){out.innerHTML='<div class="panel">'+e.message+'. Log in through Users first.</div>'}}form.onsubmit=async e=>{e.preventDefault();let x=new FormData(form);try{await api('/api/sessions',{method:'POST',body:JSON.stringify(Object.fromEntries(x))});load()}catch(e){out.textContent=e.message}};async function accept(id){try{await api('/api/sessions/'+id+'/accept',{method:'POST'});load()}catch(e){out.textContent=e.message}}load()</script></body></html>
