<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matchmaking Service</title><style>body{font-family:system-ui;max-width:760px;margin:48px auto;padding:24px;background:#f6f4ee;color:#183235}.panel{background:#fffdf8;padding:24px;border:1px solid #d9dfd8;border-radius:6px;margin:16px 0}.tag{display:inline-block;background:#b6e4d2;padding:5px 9px;margin:4px;border-radius:3px}a{margin-right:14px}</style></head><body><p>MATCHMAKING SERVICE / OWN GUI</p><h1>Mutual matches</h1><p><a href="/../users/">Users</a><a href="/">Matches</a><a href="/../sessions/">Sessions</a></p><div id="out" class="panel">Log in through Users first, then return here.</div><script>async function load(){let r=await fetch('/api/matches',{credentials:'include'}),d=await r.json();if(!r.ok){out.textContent=d.error;return}out.innerHTML=d.matches.length?d.matches.map(x=>'<article><h2>'+x.user.name+' <small>score '+x.score+'</small></h2><p>Learn: '+x.you_can_learn.map(s=>'<span class="tag">'+s+'</span>').join('')+'</p><p>Teach: '+x.they_can_learn.map(s=>'<span class="tag">'+s+'</span>').join('')+'</p></article>').join(''):'<h2>No mutual matches yet</h2><p>Give two users complementary profiles.</p>'}load()</script></body></html>
