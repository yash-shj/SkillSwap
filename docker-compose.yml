services:
  frontend:
    build: ./three-tier/frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build: ./three-tier/backend
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: skillswap
      DB_USER: skillswap
      DB_PASSWORD: skillswap
      SECRET_KEY: change-this-development-secret
    ports:
      - "4000:5000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: skillswap
      MYSQL_USER: skillswap
      MYSQL_PASSWORD: skillswap
      MYSQL_ROOT_PASSWORD: root-development-password
    volumes:
      - three_tier_mysql_data:/var/lib/mysql
      - ./three-tier/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-development-password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  three_tier_mysql_data:
